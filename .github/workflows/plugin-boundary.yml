name: Plugin boundary

on:
  push:
    paths:
      - 'sts/**'
      - 'bin/**'
  pull_request:
    paths:
      - 'sts/**'
      - 'bin/**'

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check plugin boundary
        run: bin/check_plugin_boundary.sh
