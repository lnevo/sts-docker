# Release stack: the live STS on a host that only runs it. Build profile only;
# the prebuilt service is not changed.
# Plugins are built into the image, so nothing on the host changes the running
# code; only data folders are mounted. To update: git pull this repo and the
# plugins repo, then rebuild:
#
#   docker compose -f docker-compose.yml -f docker-compose.release.yml --profile build up -d --build
#
# Expects ../sts-plugins (the plugins repo) and ../sts-docker-data beside this
# checkout, as the local (uat) stack does. STS_PLUGINS_DIR overrides the plugins folder
# itself (default ../sts-plugins/plugins, the folder holding <id>/plugin.php),
# and STS_DATA the data folder.
services:
  web:
    environment:
      - STS_STACK_NAME=live
    build:
      context: .
      additional_contexts:
        plugins: ${STS_PLUGINS_DIR:-../sts-plugins/plugins}
    volumes: !override
      - ${STS_DATA:-../sts-docker-data}/backups:/var/www/html/sts/backups
      - ${STS_DATA:-../sts-docker-data}/Rolling Stock photos:/var/www/html/sts/ImageStore/DB_Images/RollingStock/
      - ${STS_DATA:-../sts-docker-data}/config:/var/lib/sts
    restart: unless-stopped
  db:
    volumes: !override
      - ${STS_DATA:-../sts-docker-data}/database/docker/sts/db:/var/lib/mysql
    restart: unless-stopped
