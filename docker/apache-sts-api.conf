# STS REST API: send any /sts/api/ path that is not a real file to the router.
# REQUEST_URI is left intact, so no mod_rewrite is needed.
<Directory /var/www/html/sts/api>
    FallbackResource /sts/api/index.php
</Directory>

# Router internals are not entry points. Only *.php is denied: the v1 directory
# shares its name with the /sts/api/v1/ URL prefix, which must still reach the router.
<DirectoryMatch "^/var/www/html/sts/api/(lib|v1|bin)(/|$)">
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# Framing and content policy. Scripts, styles and data load only from STS itself.
# Inline scripts and handlers stay allowed because the legacy pages use them; this
# blocks injected external scripts, plugins (object/embed) and off-site form posts.
# The Swagger UI bundle needs eval, so /sts/api/docs/ also gets 'unsafe-eval'.
<IfModule mod_headers.c>
    <Location /sts/>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    </Location>
    <Location /sts/api/docs/>
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    </Location>
</IfModule>
