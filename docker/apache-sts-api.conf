# STS REST API: send any /sts/api/ path that is not a real file to the router.
# REQUEST_URI is left intact, so no mod_rewrite is needed.
<Directory /var/www/html/sts/api>
    FallbackResource /sts/api/index.php
</Directory>

# Router internals are not entry points. Only *.php is denied: the v1 directory
# shares its name with the /sts/api/v1/ URL prefix, which must still reach the router.
<DirectoryMatch "^/var/www/html/sts/api/(lib|v1|bin)(/|$)">
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# Framing and content policy. Scripts load only from STS files: no inline <script>
# code, on*= attributes or javascript: URLs (see llm-wiki/ui-conventions.md, "Scripts
# and CSP"). Styles may still be inline.
# - /sts/api/docs/: the Swagger UI bundle needs eval.
# - Generated session output (backups/session_state/sessions/, served directly and
#   through so.php) is strict too. Output stored before 2026-11-04 carries inline
#   code until each session has been rerendered once after deploy (see HANDOFF.md).
<IfModule mod_headers.c>
    <Location /sts/>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    </Location>
    <Location /sts/api/docs/>
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    </Location>
</IfModule>

# Backups hold full database dumps and workflow files: never serve them directly.
# Only the generated session output (switch lists, waybills) under
# backups/session_state/sessions/ is public. Downloads of dumps go through the API
# (admin role).
<DirectoryMatch "^/var/www/html/sts/backups">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^/var/www/html/sts/backups/session_state/sessions">
    Require all granted
</DirectoryMatch>
